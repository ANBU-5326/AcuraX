version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: acurax_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: acuraxpassword2026
      POSTGRES_DB: acurax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: acurax_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acurax_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:acuraxpassword2026@db:5432/acurax
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=5523a8e9b62a4d958564b195bf9e2c45e5ef01a8f94119d854db2c3f87f975bc
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - document_storage:/app/storage/documents
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  document_storage:
